# Markers:
#   "[PENDING] …" as a VALUE  → unknown. Exported as "" so the site renders nothing.
#   "[CONFIRM] …" as a VALUE  → a decision Major Sahab must make. Exported as "" (hidden).
#   # [CONFIRM] as a COMMENT  → value is usable now but must be confirmed before launch.
#   # [VERIFY]                → external fact to re-check before launch.
#   # [PROOF-READ]            → Urdu wording for Major Sahab to read.
