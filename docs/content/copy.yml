# docs/content/copy.yml — EVERY customer-facing string. ur = Urdu (default, RTL) · en = English.
# Pipeline: node scripts/build-locales.mjs → locales/ur.json + locales/en.default.json (identical key paths).
# A leaf is either {ur, en} or one string used for both languages.
#
# Facts are never typed here. Use placeholders, filled in Liquid from the generated `facts.*` keys:
#   {{ doctor }} {{ role }} {{ experience }} {{ experience_years }} {{ hours }} {{ days }} {{ address }}
#   {{ landmark }} {{ phone }} {{ emergency }} {{ helpline_name }} {{ helpline }} {{ registration }}
#   {{ specialty }} {{ product }} {{ code }} {{ year }} {{ qualification }} {{ institute }} {{ qualification_year }} {{ council }}
#   Shopify base-template strings also use {{ date }} {{ author }} {{ terms }} {{ count }} {{ expires_on }}.
#
# Urdu rules: punctuation ۔ ، ؟ (never . , ? inside Urdu). Latin digits. Address the reader as آپ.
# Glossary (use consistently): مشورہ consultation · نسخہ prescription/formula · علاج treatment ·
#   ادویات medicines · جڑی بوٹیاں herbs · رازداری confidentiality · ہربل فیزیشن herbal physician ·
#   طبیب Tabeeb (the NCT-registered title) · حکیم Hakeem · طبِ یونانی Unani medicine
# Markers: # [PROOF-READ] Major Sahab reads the Urdu before launch · # [CONFIRM] depends on facts.yml

